[project]
name = "content-factory"
version = "0.1.0"
description = "Motor de inteligência de conteúdo parametrizado por segmento"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
  "typer>=0.15",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "arq>=0.26",
  "httpx>=0.28",
  "ddgs>=9.0",
  "TikTokApi>=6.4",
  "playwright>=1.49",
  "python-dateutil>=2.9",
  "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  "radon>=6.0",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocs-mermaid2-plugin>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_factory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["legacy", ".venv", "alembic/versions"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.bandit]
targets = ["src"]
# B101 (assert) aceito em testes; tests/ fora do scan do bandit
exclude_dirs = ["tests", "legacy", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requer Postgres/Redis de pé (compose)",
  "e2e: testes E2E numerados (tests/e2e/)",
]
