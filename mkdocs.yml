site_name: content-factory
site_description: Motor de inteligência de conteúdo parametrizado por segmento — descobre, re-mede e ranqueia vídeos curtos por nicho.
# Required for correct canonical URLs and sitemap.xml on GitHub Pages, which
# serves the project site from a /<repo>/ sub-path rather than the domain root.
site_url: https://leonardodg.github.io/content-factory/
repo_url: https://github.com/leonardodg/content-factory
repo_name: leonardodg/content-factory
docs_dir: docs
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro
plugins: [search]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences: [{ name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }]
nav:
  - Início: index.md
  - Roteamento: roteamento.md
  - Manual:
      - manual/index.md
      - manual/guide-start.md
      - manual/fluxo-busca.md
      - manual/operacao.md
      - manual/agentes.md
      - manual/analise.md
      - manual/anti-ban.md
      - manual/chaves-api.md
  - Produto:
      - Ideia inicial (verbatim): produto/ideia-inicial.md
      - PRD: produto/prd.md
  - Specs:
      - Design: specs/2026-10-07-content-factory-design.md
      - TRD coletores: specs/trd-collectors.md
      - TRD scoring: specs/trd-scoring.md
      - TRD CLI: specs/trd-cli.md
  - ADRs:
      - 0001 Postgres+pgvector: adr/0001-postgres-pgvector.md
      - 0002 Redis+arq: adr/0002-redis-arq-fila.md
      - 0003 Coletores: adr/0003-coletores-fontes.md
      - 0004 CLI-first: adr/0004-cli-first.md
      - 0005 Google scraping: adr/0005-trends-pytrends.md
      - 0006 Manter arq+Redis: adr/0006-manter-arq-redis.md
  - Arquitetura:
      - Visão geral: architecture/README.md
      - Estado e fases: architecture/estado-e-proximas-fases.md
  - Data model: data-model/README.md
  - Diagramas: diagram/README.md
  - Mapa do ciclo: diagram/mapa-do-ciclo.md
  - Fluxos da pipeline: diagram/fluxos.md
  - Dev:
      - Índice: dev/index.md
      - Ambiente: dev/dev-environment.md
      - Estender: dev/extending.md
      - Credenciais: dev/credentials.md
  - Planos:
      - Fundação: ai-plans/2026-10-07-fundacao-coletores-banco.md
      - Revisão sênior 2026-10-14: ai-plans/2026-10-14-content-factory-revisao-senior.md
  - Entrega:
      - Playtest E2E: PLANO_TESTE_E2E.md
      - SOLID audit: SOLID_AUDIT.md
      - Revisão 2026-10-07: REVISAO_2026-10-07.md
      - Revisão 2026-10-14: REVISAO_2026-10-14.md
  - HANDOFF: HANDOFF.md
