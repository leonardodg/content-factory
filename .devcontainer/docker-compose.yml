name: content-factory
networks: { content-factory-net: {} }
services:
  python:
    container_name: cf-python
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: dev
      additional_contexts:
        devcontainer_features: ${TMPDIR:-/tmp}/devcontainercli-${USER}/container-features
    volumes:
      - ..:/app
      - ${HOME}/.gitconfig:/home/appuser/.gitconfig:ro
      - ${HOME}/.ssh:/home/appuser/.ssh:ro
    env_file:
      - ./env/app.env
    environment:
      UV_PROJECT_ENVIRONMENT: /home/appuser/.venv
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contentfactory}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-contentfactory}
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    networks: [content-factory-net]
    command: sleep infinity

  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: worker
    env_file: [./env/app.env]
    secrets: [app_secrets]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contentfactory}:${POSTGRES_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:-contentfactory}
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    networks: [content-factory-net]
    profiles: ["worker"]
    command: ["sh", "-c", "set -a; . /run/secrets/app_secrets; set +a; exec uv run arq content_factory.infra.queue.worker.WorkerSettings"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contentfactory}
      POSTGRES_DB: ${POSTGRES_DB:-contentfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [content-factory-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [content-factory-net]

volumes: { pgdata: {} }

secrets:
  app_secrets:
    file: ./secrets/secrets.env
