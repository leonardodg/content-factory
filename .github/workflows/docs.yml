name: Docs

# Publishes the MkDocs site to GitHub Pages. Only the built static output
# (site/ -- HTML, CSS, JS and assets) is uploaded; no markdown source, no
# Python, no config files reach the published site.
#
# Same pipeline as insta_kb / minimax-video-factory, plus one deliberate
# difference: pull requests run the strict BUILD too (a broken link fails the
# PR), but only a push to main DEPLOYS.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  # pull_request SEM paths: a ruleset da main exige o check "Build site" em
  # TODO PR; com filtro, PRs que não tocam docs nunca geravam o check e o
  # merge ficava BLOCKED para sempre (2026-10-14).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # --only-group docs installs just the MkDocs packages (material +
      # mermaid2) without the project or its runtime dependencies
      # (Playwright, TikTokApi, psycopg...).
      - name: Install docs dependencies
        run: uv sync --only-group docs

      # --strict turns a broken internal link into a failed build. A dead link
      # should stop the deploy, not ship. `--only-group docs` here too: a bare
      # `uv run` would re-sync the DEFAULT environment and install the whole
      # project, undoing the isolation above.
      - name: Build (strict)
        run: uv run --only-group docs mkdocs build --strict

      - name: Assert the artifact carries no source files
        run: |
          set -euo pipefail
          leaked=$(find site -type f \
            \( -name '*.md' -o -name '*.py' -o -name '*.yml' \
               -o -name '*.yaml' -o -name '*.toml' -o -name '*.sh' \
               -o -name '*.env' -o -name '*.example' \) | head -20)
          if [ -n "$leaked" ]; then
            echo "::error::source files found in the Pages artifact:"
            echo "$leaked"
            exit 1
          fi
          echo "✅ site/ is static output only ($(find site -type f | wc -l) files)"

      # Same privacy gate the CI runs on the repo (spec §10): nothing that
      # looks like a secret or personal data may reach a public site.
      - name: Privacy gate
        run: uv run --only-group docs python scripts/check_privacy.py

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
