name: ci
on: [push, pull_request]
# Menor privilégio (auditoria D1): o job só lê o repositório. Actions fixadas
# por SHA completo (tag no comentário); o Dependabot propõe as atualizações.
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: contentfactory, POSTGRES_DB: contentfactory,
               POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contentfactory"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        # sem ports o serviço não é alcançável em localhost (job fora de container)
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://contentfactory:ci@localhost/contentfactory
      TEST_DATABASE_URL: postgresql+psycopg://contentfactory:ci@localhost/contentfactory
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { enable-cache: true }
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q -m "not e2e"
      - run: uv run bandit -q -c pyproject.toml -r src/
      - run: uv run pip-audit
      - run: uv run python scripts/check_privacy.py
